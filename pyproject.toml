[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vesta-bioclimatic"
version = "0.1.0"
description = "Vesta bioclimatic comfort engine and Home Assistant psychrometric cockpit."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
standalone = ["PyYAML>=6.0"]
influx = ["PyYAML>=6.0", "requests>=2.31"]
mqtt = ["PyYAML>=6.0", "paho-mqtt>=1.6"]

[project.scripts]
vesta-bioclimatic = "vesta_bioclimatic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
